name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  bash-tests:
    name: Bash tests (bats)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install bats (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bats

      - name: Install bats (macOS)
        if: runner.os == 'macOS'
        run: brew install bats-core

      - name: Ensure docker mock is executable
        run: chmod +x tests/bash/mocks/docker

      - name: Run bats suite
        run: bats tests/bash

  powershell-tests:
    name: PowerShell tests (Pester)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pester
        shell: pwsh
        run: |
          Install-Module -Name Pester -MinimumVersion 5.5.0 -Force -SkipPublisherCheck -Scope CurrentUser

      - name: Run Pester suite
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = './tests/powershell'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputFormat = 'NUnitXml'
          $config.TestResult.OutputPath = 'pester-results-${{ matrix.os }}.xml'
          Invoke-Pester -Configuration $config

      - name: Upload Pester results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pester-results-${{ matrix.os }}
          path: pester-results-${{ matrix.os }}.xml
          retention-days: 14

  tests-passed:
    name: All tests passed
    if: always()
    needs: [bash-tests, powershell-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        run: |
          if [ "${{ needs.bash-tests.result }}" != "success" ] || [ "${{ needs.powershell-tests.result }}" != "success" ]; then
            echo "One or more test jobs failed."
            exit 1
          fi
          echo "All test jobs passed."