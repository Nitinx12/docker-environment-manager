name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  bash-tests:
    name: Bash Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bats shellcheck

      - name: Make scripts executable
        run: |
          chmod +x scripts/bash/*.sh
          chmod +x scripts/bash/lib/*.sh
          chmod +x tests/bash/mocks/docker

      - name: Verify environment
        run: |
          pwd
          bats --version
          shellcheck --version

      - name: Run ShellCheck
        run: |
          shellcheck -x scripts/bash/*.sh
          shellcheck -x scripts/bash/lib/*.sh

      - name: Run Bats tests
        run: bats tests/bash

  powershell-tests:
    name: PowerShell Tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Make Docker mock executable
        if: runner.os != 'Windows'
        shell: bash
        run: chmod +x tests/powershell/mocks/docker

      - name: Install Pester
        shell: pwsh
        run: |
          Install-Module Pester `
            -RequiredVersion 5.7.1 `
            -Scope CurrentUser `
            -Force `
            -SkipPublisherCheck

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer `
            -Scope CurrentUser `
            -Force `
            -SkipPublisherCheck

      - name: Run Script Analyzer
        shell: pwsh
        run: |
          Invoke-ScriptAnalyzer scripts/powershell -Recurse -Severity Error

      - name: Run Pester
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = "./tests/powershell"
          $config.Run.Exit = $true
          $config.Output.Verbosity = "Detailed"

          $config.TestResult.Enabled = $true
          $config.TestResult.OutputFormat = "NUnitXml"
          $config.TestResult.OutputPath = "pester-results-${{ matrix.os }}.xml"

          Invoke-Pester -Configuration $config

      - name: Upload Pester Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pester-results-${{ matrix.os }}
          path: pester-results-${{ matrix.os }}.xml
          retention-days: 14

  tests-passed:
    name: All Tests Passed
    if: always()

    needs:
      - bash-tests
      - powershell-tests

    runs-on: ubuntu-latest

    steps:
      - name: Verify Results
        run: |
          if [ "${{ needs.bash-tests.result }}" != "success" ] || \
             [ "${{ needs.powershell-tests.result }}" != "success" ]; then
            echo "One or more test jobs failed."
            exit 1
          fi

          echo "All test jobs passed."